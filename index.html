<!-- ============ SCENE 0 · INTRO ============ -->
<template id="scene-0">
<div style="position: absolute; left: 0; top: 72px; width: 1280px; height: 648px;">
<div style="position: absolute; left: 0; top: 24px; width: 1280px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;"><div style="font-size: 16px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: #3E8A2A; animation: up .8s .4s both;">Customer Support &middot; New Agent Training</div><h1 class="disp" style="margin: 0; font-size: 60px; line-height: 1.05; font-weight: 700; color: #0B2545; animation: up .9s .9s both;">Memory Manager</h1><p style="margin: 0; font-size: 23px; color: #3B4F6B; max-width: 1000px; animation: up .9s 1.6s both;">Help customers translate text themselves: faster, and for less.</p></div>
<div style="position: absolute; left: 40px; top: 220px; width: 380px; height: 180px; border-radius: 16px; background: #DCE7F7; border: 3px solid #1466F0; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; animation: pop .55s 5s both;"><span class="eb" style="color: #1466F0;">What</span><span style="font-size: 17px; font-weight: 700; color: #0B2545; line-height: 1.4;">A ControlCenter tool to reuse existing translations from memory, and submit new text for translation.</span></div>
<div style="position: absolute; left: 450px; top: 220px; width: 380px; height: 180px; border-radius: 16px; background: #E5F4DE; border: 3px solid #2F7A22; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; animation: pop .55s 9s both;"><span class="eb" style="color: #2F7A22;">Why it matters</span><span style="font-size: 17px; font-weight: 700; color: #0B2545; line-height: 1.4;">No case, no waiting in line, and no human billable work. Just their contracted per-word rate for new content.</span></div>
<div style="position: absolute; left: 860px; top: 220px; width: 380px; height: 180px; border-radius: 16px; background: #FCE3CC; border: 3px solid #C2410C; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; animation: pop .55s 13s both;"><span class="eb" style="color: #C2410C;">Your role</span><span style="font-size: 17px; font-weight: 700; color: #0B2545; line-height: 1.4;">Spot customers who open case after case just to translate text, and suggest Memory Manager.</span></div>
<div style="position: absolute; left: 160px; top: 436px; width: 960px; height: 104px; border-radius: 20px; background: #0B2545; color: #FFFFFF; display: flex; align-items: center; gap: 18px; padding: 0 30px; animation: up .7s 19s both;"><svg width="40" height="40" style="flex-shrink: 0; color: #F6C453;"><use href="#dc-warn"></use></svg><span style="font-size: 21px; font-weight: 900; line-height: 1.4;">Daily cases with text to translate in the description? That&rsquo;s money the customer could save.</span></div>

<!-- ============ SCENE 1 · WHAT IT IS ============ -->
<template id="scene-1">
<div style="position: absolute; left: 0; top: 72px; width: 1280px; height: 648px;">
<div class="sh" style="animation: up .6s .2s both;"><div class="h2">Part 1: What Memory Manager is</div><div class="h2s">Reuse memory. Submit new text. No case.</div></div>
<div class="sc" style="left: 40px; width: 592px; background: #E5F4DE; color: #2F7A22; animation: up .6s 1.4s both, litRing 17s 4s both;"><div class="sr"><span class="sn" style="background: #2F7A22;">1</span><span class="tg" style="background: #2F7A22;">Memory</span></div><div class="st">What it&rsquo;s for</div><svg class="mk" width="28" height="28" style="animation: pop .5s 20.4s both;"><use href="#dc-check"></use></svg></div>
<div class="sc" style="left: 648px; width: 592px; background: #E5F4DE; color: #2F7A22; animation: up .6s 1.6s both, litRing 17s 21s both;"><div class="sr"><span class="sn" style="background: #2F7A22;">2</span><span class="tg" style="background: #2F7A22;">ControlCenter</span></div><div class="st">Where &amp; who</div><svg class="mk" width="28" height="28" style="animation: pop .5s 37.4s both;"><use href="#dc-check"></use></svg></div>
<div class="panel" style="animation: up .7s 2.2s both;">

  bars() {

  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  initAudio() {

      const master = ctx.createGain();

  pianoNote(m, t, vel, dur) {

    });

  pianoChord(notes, t, vel, dur) {
    notes.forEach((m, i) => this.pianoNote(m, t + i * 0.018, vel, dur));
  }
  tap(t, vol, dur, freq) {

  scheduleBeat(i, t) {
    const spb = 60 / 80;
    const sw = spb * 2 / 3;
    const barIx = Math.floor(i / 4) % 8;
    const bar = this.bars()[barIx];

    const chapters = this.labels().map((label, i) => ({
      label: label,
      cls: s.started && i === cur ? 'on' : (s.started && i < cur ? 'done' : ''),
      go: () => this.go(i)
    }));
    return {
      s0: vis === 0, s1: vis === 1, s2: vis === 2, s3: vis === 3, s4: vis === 4, s5: vis === 5, s6: vis === 6, s7: vis === 7,
      showCover: !s.started,
      pauseCls: s.playing ? '' : 'paused',
      isPlaying: s.playing,
      notPlaying: !s.playing,
      playLabel: s.playing ? 'Pause' : (s.ended ? 'Replay' : 'Play'),
      progressW: (Math.min(1, done / total) * 100).toFixed(2) + '%',
      timeLabel: this.fmt(done) + ' / ' + this.fmt(total),
      chapters: chapters,
      steps: [1, 2, 3, 4, 5, 6, 7].map((n) => ({ n: n, on: s.started && s.scene >= 0 && s.scene === n })),
      showSubs: s.subsOn && s.started,
      subs: (() => {
        const L = s.scene >= 0 ? this.subLines()[s.scene] : [];
        let act = -1;
        L.forEach((c, i) => { if (s.el >= c[0]) act = i; });
        return L.map((c, i) => ({ text: c[1], on: i === act }));
      })(),
      subsOn: s.subsOn,
      subsLabel: s.subsOn ? 'Hide captions' : 'Show captions',
      subsColor: s.subsOn ? '#8FD16F' : '#A9B8CC',
      toggleSubs: () => this.setState({ subsOn: !this.state.subsOn }),
      musicOn: s.music,
      musicOff: !s.music,
      musicLabel: s.music ? 'Music on' : 'Music off',
      toggleMusic: () => {
        const on = !this.state.music;
        this.setState({ music: on }, () => {
          if (!on) this.musicStop(0.6);
          else if (this.state.playing) this.musicStart();
        });
      },
      togglePlay: () => {
        if (!this.state.started || this.state.ended) this.go(0);
        else {
          const playing = !this.state.playing;
          if (playing) this.musicResume(); else this.musicPause();
          this.setState({ playing: playing });
        }
      },
      replay: () => this.go(0),
      back10: () => this.jump(-10000),
      fwd10: () => this.jump(10000),
      prev: () => this.go(Math.max(0, cur - 1)),
      next: () => this.go(Math.min(d.length - 1, cur + 1))
    };
  }
}

Player.prototype.setState = function (obj, cb) { Object.assign(this.state, obj); this.render(); if (cb) cb(); };
Player.prototype.render = function () {
  const v = this.renderVals();
  const $ = (id) => document.getElementById(id);
  const s = this.state;
  const vis = s.started ? s.scene : -2;
  if (vis !== this._vis) {
    this._vis = vis;
    const tpl = $('scene-' + vis);
    $('sceneHost').innerHTML = tpl ? tpl.innerHTML : '';
  }
  $('stage').classList.toggle('paused', !s.playing);
  $('cover').hidden = !v.showCover;
  const st = v.steps.find((x) => x.on);
  const stn = st ? st.n : 0;
  if (stn !== this._step) { this._step = stn; $('steps').innerHTML = stn ? STEP_HTML.split('{{st.n}}').join(String(stn)) : ''; }
  const sb = v.showSubs ? v.subs.find((x) => x.on) : null;
  const key = sb ? s.scene + '|' + sb.text : '';
  if (key !== this._sub) {
    this._sub = key;
    $('subs').innerHTML = '';
    if (sb) { const d = document.createElement('div'); d.innerHTML = SUB_OPEN + '</div>'; d.firstChild.textContent = sb.text; $('subs').appendChild(d.firstChild); }
  }
  $('prog').style.width = v.progressW;
  $('timeLabel').textContent = v.timeLabel;
  $('playLabel').textContent = v.playLabel;
  $('playBtn').setAttribute('aria-label', v.playLabel);
  $('icoPause').hidden = !v.isPlaying; $('icoPlay').hidden = v.isPlaying;
  $('musicLabel').textContent = v.musicLabel; $('musicBtn').setAttribute('aria-label', v.musicLabel); $('musicBtn').setAttribute('aria-pressed', String(v.musicOn));
  $('icoMusicOn').hidden = !v.musicOn; $('icoMusicOff').hidden = v.musicOn;
  $('subsBtn').setAttribute('aria-label', v.subsLabel); $('subsBtn').setAttribute('aria-pressed', String(v.subsOn)); $('subsIcon').setAttribute('stroke', v.subsColor);
  const ck = v.chapters.map((c) => c.cls).join(',');
  if (ck !== this._chips) {
    this._chips = ck;
    const host = $('chapters'); host.innerHTML = '';
    v.chapters.forEach((c, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip ' + c.cls; b.textContent = c.label;
      b.addEventListener('click', () => this.go(i)); host.appendChild(b);
    });
  }
};
const P = new Player();
const call = (k) => () => P.renderVals()[k]();
document.getElementById('coverPlay').addEventListener('click', call('togglePlay'));
document.getElementById('playBtn').addEventListener('click', call('togglePlay'));
document.getElementById('replayBtn').addEventListener('click', call('replay'));
document.getElementById('prevBtn').addEventListener('click', call('prev'));
document.getElementById('back10Btn').addEventListener('click', call('back10'));
document.getElementById('fwd10Btn').addEventListener('click', call('fwd10'));
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { e.preventDefault(); call('back10')(); } else if (e.key === 'ArrowRight') { e.preventDefault(); call('fwd10')(); } else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); call('togglePlay')(); } });
document.getElementById('nextBtn').addEventListener('click', call('next'));
document.getElementById('musicBtn').addEventListener('click', call('toggleMusic'));
document.getElementById('subsBtn').addEventListener('click', call('toggleSubs'));
P.render();
P.componentDidMount();

</script>
</body>
